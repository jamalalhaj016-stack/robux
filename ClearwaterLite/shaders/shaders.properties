# ---------------------------------------------------------------------------
#  Clearwater Lite
#  Built to stay playable on older hardware. Start on the profile that matches
#  your card and only raise things you can spare the frames for.
# ---------------------------------------------------------------------------

# --- Quality profiles ------------------------------------------------------

profiles = ULTRA LOW MEDIUM HIGH

profile.ULTRA  = !SHADOWS !COLORED_SHADOWS !BLOOM !VIGNETTE !FOG \
                 !WATER_WAVES !WATER_SPECULAR !WAVING_PLANTS !WAVING_LEAVES \
                 WATER_DETAIL=1 \
                 shadowMapResolution=512 shadowDistance=32.0

profile.LOW    = !SHADOWS !COLORED_SHADOWS !BLOOM !VIGNETTE !FOG \
                 WATER_DETAIL=1 \
                 shadowMapResolution=512 shadowDistance=32.0 \
                 !WATER_WAVES !WATER_SPECULAR !WAVING_PLANTS !WAVING_LEAVES

profile.MEDIUM = SHADOWS !COLORED_SHADOWS !BLOOM VIGNETTE \
                 SHADOW_SAMPLES=1 SHADOW_SOFTNESS=0.5 \
                 shadowMapResolution=512 shadowDistance=48.0 \
                 WATER_WAVES !WATER_SPECULAR WATER_DETAIL=1 \
                 WAVING_PLANTS !WAVING_LEAVES FOG_DENSITY=0.5

profile.HIGH   = SHADOWS !COLORED_SHADOWS BLOOM VIGNETTE \
                 SHADOW_SAMPLES=4 SHADOW_SOFTNESS=1.0 \
                 shadowMapResolution=1024 shadowDistance=96.0 \
                 WATER_WAVES WATER_SPECULAR WATER_DETAIL=2 \
                 WAVING_PLANTS WAVING_LEAVES

# --- Options menu layout ---------------------------------------------------

screen = [PERFORMANCE] [WATER] [LIGHTING] [SKY] [POST] <empty> \
         <profile> <empty> EXPOSURE SATURATION

screen.PERFORMANCE = SHADOWS shadowMapResolution shadowDistance \
                     SHADOW_SAMPLES SHADOW_SOFTNESS COLORED_SHADOWS \
                     <empty> sunPathRotation ambientOcclusionLevel

screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT WATER_WAVE_SPEED \
               WATER_DETAIL WATER_NORMAL_STRENGTH <empty> \
               WATER_SPECULAR WATER_OPACITY WATER_ABSORPTION

screen.LIGHTING = SUN_INTENSITY AMBIENT_INTENSITY MINIMUM_LIGHT <empty> \
                  BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMPERATURE HANDHELD_LIGHT \
                  <empty> WAVING_PLANTS WAVING_LEAVES WAVE_SPEED WAVE_STRENGTH

screen.SKY = SKY_BRIGHTNESS STARS_BRIGHTNESS <empty> FOG FOG_DENSITY FOG_START

screen.POST = BLOOM BLOOM_STRENGTH BLOOM_RADIUS BLOOM_THRESHOLD <empty> \
              EXPOSURE SATURATION CONTRAST <empty> VIGNETTE VIGNETTE_STRENGTH

sliders = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS \
          sunPathRotation ambientOcclusionLevel \
          SUN_INTENSITY AMBIENT_INTENSITY MINIMUM_LIGHT \
          BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMPERATURE \
          WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_DETAIL \
          WATER_NORMAL_STRENGTH WATER_OPACITY WATER_ABSORPTION \
          WAVE_SPEED WAVE_STRENGTH \
          SKY_BRIGHTNESS STARS_BRIGHTNESS FOG_DENSITY FOG_START \
          BLOOM_STRENGTH BLOOM_RADIUS BLOOM_THRESHOLD \
          EXPOSURE SATURATION CONTRAST VIGNETTE_STRENGTH

# --- Render setup ----------------------------------------------------------

# colortex1 carries the water flag, not colour. Blending it would scale the
# flag by the water's alpha, so write it straight.
blend.gbuffers_water.colortex1 = off

# Skip the whole shadow pass when shadows are off instead of rendering a map
# nothing reads.
program.shadow.enabled = SHADOWS

# Our own lighting replaces vanilla's directional shading and its underwater
# screen overlay, and handheld light is done in the shader.
oldLighting = false
oldHandLight = false
underwaterOverlay = false
