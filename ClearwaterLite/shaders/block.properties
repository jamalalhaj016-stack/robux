# Clearwater Lite - block ids handed to the shaders as mc_Entity.x
#
#   10 = water
#   30 = small plants, bend from the base
#   31 = leaves, sway as a whole
#   32 = upper half of two-block plants
#
# Ids that do not exist in your version are simply ignored, so the same file
# covers a wide range of Minecraft releases.

block.10 = water flowing_water bubble_column

block.30 = grass short_grass fern dead_bush seagrass kelp kelp_plant \
           dandelion poppy blue_orchid allium azure_bluet cornflower \
           lily_of_the_valley wither_rose oxeye_daisy torchflower \
           red_tulip orange_tulip white_tulip pink_tulip \
           wheat carrots potatoes beetroots nether_wart sweet_berry_bush \
           pink_petals

block.31 = oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves \
           dark_oak_leaves mangrove_leaves cherry_leaves pale_oak_leaves \
           azalea_leaves flowering_azalea_leaves vine cave_vines \
           cave_vines_plant weeping_vines weeping_vines_plant \
           twisting_vines twisting_vines_plant

block.32 = tall_grass large_fern tall_seagrass \
           sunflower lilac rose_bush peony pitcher_plant
